# Publication Netlify : site 100 % statique (build Vite → dist/).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Modèles 3D, textures, sons et images : fichiers lourds qui changent rarement.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fichiers du build nommés avec une empreinte : cache permanent.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ktx2"
  [headers.values]
    Content-Type = "image/ktx2"
